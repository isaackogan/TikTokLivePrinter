name: "Release: Publish tiktok-live-printer"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libraries/tiktok-live-printer
    steps:
      - name: Enforce main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release must be triggered from main, got ${{ github.ref }}"
          exit 1

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Bump version
        run: pnpm version ${{ inputs.bump }} --no-git-tag-version

      - name: Read new version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Test and build
        run: pnpm run test && pnpm run build

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --access public --no-git-checks

      - name: Commit and tag
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add libraries/tiktok-live-printer/package.json
          git commit -m "chore: release tiktok-live-printer v${{ steps.version.outputs.version }} [skip ci]"
          git tag "tiktok-live-printer-v${{ steps.version.outputs.version }}"
          git push
          git push origin "tiktok-live-printer-v${{ steps.version.outputs.version }}"

      - name: Summary
        run: echo "### Published tiktok-live-printer@${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
